<div id="writing-screen" class="screen">
    <div class="card animate-slide-up">
        <div class="card-header">
            <div class="typewriter-icon">✍️</div>
            <h2>Напишите фразу</h2>
        </div>
        <div class="card-body">
            <p class="hint-text">Придумайте любую фразу, которую другие будут рисовать</p>
            <input type="text" class="input-styled input-glow" id="phrase-input" placeholder="Введите фразу..." maxlength="100" autocomplete="off">
            <button id="submit-phrase-btn" class="btn btn-primary" onclick="window.submitPhrase?.()">📤 Отправить</button>
            <p id="writing-status" class="status-text"></p>
        </div>
    </div>
</div>
