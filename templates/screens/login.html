<div id="login-screen" class="screen active">
    <div class="card card-glow animate-slide-up">
        <div class="card-header">
            <div class="emoji-bounce">🎨</div>
            <h1>Испорченный телефончик</h1>
            <p class="subtitle">Нарисуй, угадай, рассмейся!</p>
        </div>
        <div class="card-body">
            <input type="text" id="nickname-input" class="input-styled" placeholder="Введите никнейм" maxlength="20" autocomplete="off">
            <button id="join-btn" class="btn btn-primary btn-pulse" onclick="window.joinGame?.()">✨ Войти в игру ✨</button>
        </div>
    </div>
</div>
